# Dev-only override: build the `dev` target (dev dependency group, uv, and
# debugging tools) and publish 8080 to the host so the README quick-start
# (`curl http://localhost:8080/...`) works.
#
# Apply with `-f compose.yml -f compose.dev.yml`. See README and
# docs/development.md for the full command.  staging / production use
# `compose.override.podman.yml` as `compose.override.yml`, build the default
# `runtime` target, and do NOT publish this port (nginx terminates upstream).
services:
  app:
    build:
      target: dev
    ports:
      - "8080:8080"
