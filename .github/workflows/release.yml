name: release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ddbj/ddbj-search-api'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    if: github.repository == 'ddbj/ddbj-search-api'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --generate-notes ddbj_search_api-"$TAG".tar.gz ddbj_search_api-"$TAG"-py3-none-any.whl
