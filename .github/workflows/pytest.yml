name: pytest

on:
  push:
    branches:
      - main
    paths:
      - "ddbj_search_api/**"
      - "pyproject.toml"
      - "tests/**"
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: |
          uv run pytest -s
